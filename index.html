<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日提升计划</title>
<style>
:root {
  --primary: #6ee7b7;
  --primary-dark: #34d399;
  --primary-deep: #10b981;
  --bg: #f0fdf8;
  --card: #ffffff;
  --text: #1a3a2e;
  --text-light: #6b9080;
  --border: #d1fae5;
  --shadow: rgba(16, 185, 129, 0.08);
  --sidebar-w: 240px;
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* 侧边栏 */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  overflow-y: auto;
  z-index: 100;
  transition: transform 0.3s ease;
}

.sidebar .logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary-deep);
  margin-bottom: 8px;
  text-align: center;
}

.sidebar .subtitle {
  font-size: 12px;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 32px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 15px;
  color: var(--text);
  margin-bottom: 4px;
}

.nav-item:hover, .nav-item.active {
  background: var(--primary);
  color: #064e3b;
  font-weight: 600;
}

.nav-item .icon { font-size: 18px; }

/* 主内容区 */
.main {
  margin-left: var(--sidebar-w);
  padding: 24px;
  max-width: 800px;
}

/* 手机端 */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .main {
    margin-left: 0;
    padding: 16px;
    padding-top: 64px;
  }
  .topbar {
    display: flex !important;
  }
}

.topbar {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  align-items: center;
  padding: 0 16px;
  z-index: 99;
  box-shadow: 0 2px 8px var(--shadow);
}

.topbar .menu-btn {
  font-size: 24px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  color: var(--primary-deep);
}

.topbar .title {
  margin-left: 12px;
  font-weight: 600;
  font-size: 16px;
  color: var(--primary-deep);
}

/* 遮罩 */
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 90;
}
.overlay.open { display: block; }

/* 卡片 */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px var(--shadow);
  border: 1px solid var(--border);
}

.card-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--primary-deep);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 看板 */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat {
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
}

.stat .num {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary-deep);
}

.stat .label {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

/* 分类标签 */
.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.cat-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card);
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  transition: all 0.2s;
}

.cat-btn.active {
  background: var(--primary);
  border-color: var(--primary-deep);
  color: #064e3b;
  font-weight: 600;
}

/* 输入框 */
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.input-row input {
  flex: 1;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  background: var(--bg);
  color: var(--text);
}

.input-row input:focus {
  border-color: var(--primary-deep);
}

.btn {
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  background: var(--primary-deep);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn:hover { background: #059669; }
.btn:active { transform: scale(0.97); }

.btn-sm {
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 10px;
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--primary-deep);
  color: var(--primary-deep);
}

/* 计划列表 */
.plan-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 12px;
  background: var(--bg);
  margin-bottom: 8px;
  transition: all 0.2s;
  border: 1px solid transparent;
}

.plan-item:hover { border-color: var(--border); }

.plan-item.done {
  opacity: 0.6;
}

.plan-item.done .plan-text {
  text-decoration: line-through;
  color: var(--text-light);
}

.checkbox {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--primary-deep);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}

.checkbox.checked {
  background: var(--primary-deep);
}

.checkbox.checked::after {
  content: "✓";
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.plan-text {
  flex: 1;
  font-size: 15px;
}

.plan-cat {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--primary);
  color: #064e3b;
  margin-right: 8px;
}

.plan-delete {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #ef4444;
  padding: 4px;
  opacity: 0.5;
  transition: opacity 0.2s;
}

.plan-delete:hover { opacity: 1; }

/* AI 助手 */
.ai-chat {
  max-height: 400px;
  overflow-y: auto;
  margin-bottom: 12px;
}

.ai-msg {
  padding: 12px 16px;
  border-radius: 12px;
  margin-bottom: 10px;
  font-size: 14px;
  line-height: 1.7;
}

.ai-msg.user {
  background: var(--primary);
  color: #064e3b;
  margin-left: 40px;
  font-weight: 500;
}

.ai-msg.bot {
  background: var(--bg);
  color: var(--text);
  margin-right: 40px;
  border: 1px solid var(--border);
}

.ai-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

/* 复盘 */
.review-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.review-card {
  background: linear-gradient(135deg, #ecfdf5, #a7f3d0);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}

.review-card .num {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary-deep);
}

.review-card .label {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

.history-item {
  padding: 12px;
  border-radius: 10px;
  background: var(--bg);
  margin-bottom: 8px;
  font-size: 14px;
}

.history-date {
  font-weight: 600;
  color: var(--primary-deep);
  margin-bottom: 4px;
}

/* 页面切换 */
.page { display: none; }
.page.active { display: block; }

/* 空状态 */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}

.empty .emoji { font-size: 48px; margin-bottom: 12px; }

/* 进度条 */
.progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin: 12px 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-deep));
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* 动画 */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn 0.3s ease; }
</style>
</head>
<body>

<!-- 手机顶部栏 -->
<div class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <span class="title">每日提升</span>
</div>

<!-- 遮罩 -->
<div class="overlay" onclick="toggleSidebar()"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="sidebar">
  <div class="logo">🌿 每日提升</div>
  <div class="subtitle">记录 · 成长 · 复盘</div>
  <div class="nav-item active" onclick="switchPage('plans', this)">
    <span class="icon">📋</span> 今日计划
  </div>
  <div class="nav-item" onclick="switchPage('ai', this)">
    <span class="icon">🤖</span> AI 助手
  </div>
  <div class="nav-item" onclick="switchPage('review', this)">
    <span class="icon">📈</span> 成长复盘
  </div>
</div>

<!-- 主内容 -->
<div class="main">

  <!-- 看板 -->
  <div class="dashboard">
    <div class="stat">
      <div class="num" id="totalCount">0</div>
      <div class="label">今日计划</div>
    </div>
    <div class="stat">
      <div class="num" id="doneCount">0</div>
      <div class="label">已完成</div>
    </div>
    <div class="stat">
      <div class="num" id="rateCount">0%</div>
      <div class="label">完成率</div>
    </div>
    <div class="stat">
      <div class="num" id="streakCount">0</div>
      <div class="label">连续打卡</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- 今日计划页 -->
  <div class="page active" id="page-plans">
    <div class="card">
      <div class="card-title">📝 添加计划</div>
      <div class="categories">
        <button class="cat-btn active" onclick="setCat(this)">学习提升</button>
        <button class="cat-btn" onclick="setCat(this)">健康运动</button>
        <button class="cat-btn" onclick="setCat(this)">工作事业</button>
        <button class="cat-btn" onclick="setCat(this)">习惯养成</button>
      </div>
      <div class="input-row">
        <input type="text" id="planInput" placeholder="输入今天的计划，比如：背50个单词..." onkeydown="if(event.key==='Enter') addPlan()">
        <button class="btn" onclick="addPlan()">添加</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📋 今日计划列表</div>
      <div id="planList">
        <div class="empty">
          <div class="emoji">🌱</div>
          <div>还没有计划，添加一条开始吧！</div>
        </div>
      </div>
    </div>
  </div>

  <!-- AI助手页 -->
  <div class="page" id="page-ai">
    <div class="card">
      <div class="card-title">🤖 AI 提升助手</div>
      <div class="ai-quick">
        <button class="btn btn-sm btn-outline" onclick="aiAsk('建议')">💡 今日执行建议</button>
        <button class="btn btn-sm btn-outline" onclick="aiAsk('考核')">📊 今日考核打分</button>
        <button class="btn btn-sm btn-outline" onclick="aiAsk('推荐')">🎯 明日计划推荐</button>
        <button class="btn btn-sm btn-outline" onclick="aiAsk('坚持')">🔥 怎么坚持习惯</button>
      </div>
      <div class="ai-chat" id="aiChat">
        <div class="ai-msg bot">你好！我是你的提升助手 🌿<br>点击上面的按钮，或者直接在下方输入问题，我来帮你分析、建议、考核。</div>
      </div>
      <div class="input-row">
        <input type="text" id="aiInput" placeholder="问我任何关于提升的问题..." onkeydown="if(event.key==='Enter') aiSend()">
        <button class="btn" onclick="aiSend()">发送</button>
      </div>
    </div>
  </div>

  <!-- 复盘页 -->
  <div class="page" id="page-review">
    <div class="card">
      <div class="card-title">📈 成长数据</div>
      <div class="review-grid">
        <div class="review-card">
          <div class="num" id="totalDone">0</div>
          <div class="label">累计完成</div>
        </div>
        <div class="review-card">
          <div class="num" id="totalDays">0</div>
          <div class="label">坚持天数</div>
        </div>
        <div class="review-card">
          <div class="num" id="maxStreak">0</div>
          <div class="label">最长连击</div>
        </div>
        <div class="review-card">
          <div class="num" id="catCount">0</div>
          <div class="label">分类完成</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📅 历史记录</div>
      <div id="historyList">
        <div class="empty">
          <div class="emoji">📂</div>
          <div>完成几天后这里会显示历史</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ========== 数据层 ==========
let plans = JSON.parse(localStorage.getItem('plans') || '[]');
let currentCat = '学习提升';
let streak = parseInt(localStorage.getItem('streak') || '0');
let lastDate = localStorage.getItem('lastDate') || '';
let reviewData = JSON.parse(localStorage.getItem('reviewData') || '{}');
let maxStreak = parseInt(localStorage.getItem('maxStreak') || '0');

const today = new Date().toLocaleDateString('zh-CN');

// 检查日期
if (lastDate && lastDate !== today) {
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  if (lastDate !== yesterday.toLocaleDateString('zh-CN')) {
    streak = 0;
  }
}

// ========== 页面切换 ==========
function switchPage(pageId, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.querySelector('.overlay').classList.remove('open');
  }
  if (pageId === 'review') renderReview();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('open');
}

// ========== 分类 ==========
function setCat(el) {
  document.querySelectorAll('.cat-btn').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentCat = el.textContent;
}

// ========== 计划 ==========
function addPlan() {
  const input = document.getElementById('planInput');
  const text = input.value.trim();
  if (!text) return;
  plans.push({ id: Date.now(), text, cat: currentCat, done: false, date: today });
  input.value = '';
  saveData();
  renderPlans();
  updateDashboard();
}

function togglePlan(id) {
  const plan = plans.find(p => p.id === id);
  if (plan) {
    plan.done = !plan.done;
    if (plan.done) {
      reviewData[today] = reviewData[today] || { total: 0, done: 0, cats: {} };
      reviewData[today].done++;
      reviewData[today].cats[plan.cat] = (reviewData[today].cats[plan.cat] || 0) + 1;
    }
    saveData();
    renderPlans();
    updateDashboard();
  }
}

function deletePlan(id) {
  plans = plans.filter(p => p.id !== id);
  saveData();
  renderPlans();
  updateDashboard();
}

function renderPlans() {
  const list = document.getElementById('planList');
  const todayPlans = plans.filter(p => p.date === today);
  if (todayPlans.length === 0) {
    list.innerHTML = '<div class="empty"><div class="emoji">🌱</div><div>还没有计划，添加一条开始吧！</div></div>';
    return;
  }
  list.innerHTML = todayPlans.map(p => `
    <div class="plan-item ${p.done ? 'done' : ''} fade-in">
      <div class="checkbox ${p.done ? 'checked' : ''}" onclick="togglePlan(${p.id})"></div>
      <span class="plan-cat">${p.cat}</span>
      <span class="plan-text">${p.text}</span>
      <button class="plan-delete" onclick="deletePlan(${p.id})">×</button>
    </div>
  `).join('');
}

function updateDashboard() {
  const todayPlans = plans.filter(p => p.date === today);
  const total = todayPlans.length;
  const done = todayPlans.filter(p => p.done).length;
  const rate = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('rateCount').textContent = rate + '%';
  document.getElementById('streakCount').textContent = streak;
  document.getElementById('progressFill').style.width = rate + '%';
}

function saveData() {
  localStorage.setItem('plans', JSON.stringify(plans));
  localStorage.setItem('streak', streak.toString());
  localStorage.setItem('lastDate', today);
  localStorage.setItem('reviewData', JSON.stringify(reviewData));
  localStorage.setItem('maxStreak', maxStreak.toString());
}

// ========== AI 助手 ==========
function aiAsk(type) {
  const chat = document.getElementById('aiChat');
  let userText = '';
  let botText = '';
  const todayPlans = plans.filter(p => p.date === today);
  const donePlans = todayPlans.filter(p => p.done);

  switch(type) {
    case '建议':
      userText = '给我一些今日执行建议';
      if (todayPlans.length === 0) {
        botText = '🌿 你今天还没有添加计划哦！先去「今日计划」添加 2-3 条，我再来帮你分析执行节奏。';
      } else {
        const undone = todayPlans.filter(p => !p.done);
        botText = `📌 你今天有 ${todayPlans.length} 条计划，已完成 ${donePlans.length} 条。<br><br>`;
        if (undone.length > 0) {
          botText += `⏰ <strong>执行建议：</strong><br>1. 先做最重要的一条：「${undone[0].text}」<br>2. 用番茄钟（25分钟专注+5分钟休息）推进<br>3. 每完成一条就打勾，保持正反馈<br>4. 困难的任务放在精力最好的时段`;
        } else {
          botText += '🎉 全部完成了！建议：花 5 分钟复盘今天哪些做得好，哪些可以优化，然后去「复盘」页看看数据。';
        }
      }
      break;
    case '考核':
      userText = '帮我考核打分';
      if (todayPlans.length === 0) {
        botText = '还没有计划数据，先去添加吧！';
      } else {
        const rate = Math.round(donePlans.length / todayPlans.length * 100);
        let grade = 'D';
        let comment = '';
        if (rate === 100) { grade = 'S'; comment = '完美执行！你是自己的王者 🏆'; }
        else if (rate >= 80) { grade = 'A'; comment = '非常棒，差一点就完美了，明天冲S！'; }
        else if (rate >= 60) { grade = 'B'; comment = '及格线以上，但还有提升空间，反思一下卡在哪了'; }
        else if (rate >= 30) { grade = 'C'; comment = '今天状态一般，别气馁，找出阻碍你的原因'; }
        else { grade = 'D'; comment = '今天几乎没动，诚实面对自己，明天重新来'; }
        botText = `📊 <strong>今日考核报告</strong><br>计划总数：${todayPlans.length}<br>完成：${donePlans.length}<br>完成率：${rate}%<br><br>评级：<strong>${grade}</strong><br>${comment}`;
      }
      break;
    case '推荐':
      userText = '推荐明日计划';
      botText = '🎯 <strong>明日计划推荐</strong><br>基于你的分类，建议明天安排：<br>1. 📖 学习提升：30分钟深度阅读或课程<br>2. 🏃 健康运动：20分钟有氧或拉伸<br>3. 💼 工作事业：推进一个核心任务<br>4. 🔁 习惯养成：早起/冥想/写日记（选一个）<br><br>💡 建议每条计划写具体（比如"读30页《xxx》"而非"读书"），具体才能执行。';
      break;
    case '坚持':
      userText = '怎么坚持习惯';
      botText = '🔥 <strong>坚持习惯的 5 个核心方法：</strong><br>1. <strong>从微习惯开始</strong>：每天只做2分钟，降低启动门槛<br>2. <strong>绑定已有习惯</strong>：比如"刷牙后→冥想2分钟"<br>3. <strong>环境设计</strong>：把阻力降到最低（书放床头、运动服提前摆好）<br>4. <strong>即时奖励</strong>：完成后给自己一个小奖励<br>5. <strong>允许中断但不允许连续两天</strong>：中断一天没关系，绝不允许连续两天<br><br>你现在的打卡天数：${streak} 天，继续保持！';
      break;
  }

  chat.innerHTML += `<div class="ai-msg user fade-in">${userText}</div><div class="ai-msg bot fade-in">${botText}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

function aiSend() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  const chat = document.getElementById('aiChat');
  chat.innerHTML += `<div class="ai-msg user fade-in">${text}</div>`;
  let reply = '🌿 我理解你的问题。目前我是本地助手，回复基于内置逻辑。';
  if (text.includes('计划') || text.includes('安排')) {
    reply += '<br>建议你去「今日计划」添加具体任务，写清楚"做什么+多长时间"，执行起来更容易。';
  } else if (text.includes('坚持') || text.includes('放弃')) {
    reply += '<br>坚持的秘诀是：降低门槛 + 即时反馈 + 环境设计。从每天2分钟开始，别给自己太大压力。';
  } else if (text.includes('效率') || text.includes('专注')) {
    reply += '<br>推荐番茄工作法：25分钟专注 + 5分钟休息，4轮后休息15分钟。手机开勿扰模式。';
  } else if (text.includes('运动') || text.includes('健身')) {
    reply += '<br>运动建议：每周3-4次，每次30分钟以上。新手从快走/慢跑开始，循序渐进。';
  } else if (text.includes('学习') || text.includes('读书')) {
    reply += '<br>学习建议：费曼学习法——学完试着用自己的话讲给别人听，讲不通的地方就是没掌握的。';
  } else {
    reply += '<br>你可以问我：怎么坚持习惯、怎么提高效率、怎么安排计划、运动建议、学习方法等。想聊更复杂的可以接入真实AI。';
  }
  chat.innerHTML += `<div class="ai-msg bot fade-in">${reply}</div>`;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;
}

// ========== 复盘 ==========
function renderReview() {
  const totalDone = plans.filter(p => p.done).length;
  const days = Object.keys(reviewData).length;
  const catDone = {};
  plans.filter(p => p.done).forEach(p => { catDone[p.cat] = (catDone[p.cat] || 0) + 1; });
  const catTotal = Object.values(catDone).reduce((a,b) => a+b, 0);

  document.getElementById('totalDone').textContent = totalDone;
  document.getElementById('totalDays').textContent = days;
  document.getElementById('maxStreak').textContent = maxStreak;
  document.getElementById('catCount').textContent = catTotal;

  const historyList = document.getElementById('historyList');
  const sortedDays = Object.keys(reviewData).sort((a,b) => b.localeCompare(a));
  if (sortedDays.length === 0) {
    historyList.innerHTML = '<div class="empty"><div class="emoji">📂</div><div>完成几天后这里会显示历史</div></div>';
  } else {
    historyList.innerHTML = sortedDays.slice(0, 10).map(d => `
      <div class="history-item fade-in">
        <div class="history-date">${d} · 完成 ${reviewData[d].done} 条</div>
        <div style="color:var(--text-light);font-size:13px;">${Object.entries(reviewData[d].cats || {}).map(([k,v]) => `${k}:${v}`).join(' | ')}</div>
      </div>
    `).join('');
  }
}

// ========== 初始化 ==========
renderPlans();
updateDashboard();
